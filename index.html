<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Colour Sort">
<meta name="theme-color" content="#16213F">
<title>Molly Colour Sort</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- level map -->
  <section id="map" class="screen">
    <div class="bar"><div class="totstars"><span class="starI"></span><b id="starTotal">0</b></div></div>
    <div id="mapScroll"><div id="mapPath"></div></div>
  </section>
  <!-- game -->
  <section id="game" class="screen hidden">
    <div class="bar">
      <button id="btnHome" class="round grey" aria-label="map"><svg viewBox="0 0 60 60"><path d="M10 30 L30 12 L50 30 V50 H36 V38 H24 V50 H10Z" fill="#fff"/></svg></button>
      <div id="levelPill">1</div>
      <div class="spacer"></div>
    </div>
    <canvas id="cv"></canvas>
    <div class="controls">
      <button id="btnUndo" class="round orange" aria-label="undo"><svg viewBox="0 0 60 60"><path d="M42 44 A16 16 0 1 0 16 26" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M6 20 L17 33 L27 19Z" fill="#fff"/></svg></button>
      <button id="btnHint" class="round green" aria-label="hint"><svg viewBox="0 0 60 60"><circle cx="30" cy="24" r="14" fill="#FFF6B0"/><rect x="23" y="38" width="14" height="10" rx="3" fill="#fff"/></svg></button>
      <button id="btnRestart" class="round red" aria-label="restart"><svg viewBox="0 0 60 60"><path d="M30 13 A17 17 0 1 1 14 36" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M22 3 L37 13 L22 23Z" fill="#fff"/></svg></button>
    </div>
    <div id="win" class="hidden">
      <div class="card">
        <div class="stars"><span class="bigstar" id="s1"></span><span class="bigstar mid" id="s2"></span><span class="bigstar" id="s3"></span></div>
        <div class="dots"><i style="background:#FF3D57"></i><i style="background:#FF8C1A"></i><i style="background:#FFD21F"></i><i style="background:#2FD06F"></i><i style="background:#2F7BFF"></i></div>
        <div class="row"><button id="btnWinMap" class="round grey" aria-label="map"><svg viewBox="0 0 60 60"><path d="M10 30 L30 12 L50 30 V50 H36 V38 H24 V50 H10Z" fill="#fff"/></svg></button>
        <button id="btnNext" class="round green big" aria-label="next"><svg viewBox="0 0 60 60"><path d="M20 12 L48 30 L20 48Z" fill="#fff"/></svg></button></div>
      </div>
    </div>
  </section>
</div>
<script src="solver.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
